name: 13F 공시 알리미 봇

# 💡 어떤 조건에서 이 봇을 실행할지 설정하는 부분입니다.
on:
  # 1. 내가 원할 때 언제든 수동으로 실행 가능 (기존 기능)
  workflow_dispatch:

  # 2. 자동으로 실행되는 스케줄러 추가 (여기가 핵심!)
  schedule:
    # ⚠️ 깃허브 시간은 세계 표준시(UTC) 기준이라 한국 시간보다 9시간 느립니다.
    # 아래 설정은 한국 시간으로 [매주 토요일 오전 9시 00분]에 알아서 켜지라는 뜻입니다.
    - cron: '0 0 * * 6'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v3

      - name: 파이썬 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 프로그램 설치
        run: pip install requests

      - name: 봇 실행
        env:
          SEC_13F_WEBHOOK_URL: ${{ secrets.SEC_13F_WEBHOOK_URL }}
        run: python 13f_bot.py
