name: SEC 자동 알리미 + 시장 뉴스 봇


on:

  workflow_dispatch:

  schedule:

    # 매시간 실행
    - cron: '0 * * * 1-5'


jobs:


  build:


    runs-on: ubuntu-latest


    permissions:

      contents: write



    steps:


      - name: 코드 체크아웃

        uses: actions/checkout@v3



      - name: 파이썬 세팅

        uses: actions/setup-python@v4

        with:

          python-version: '3.10'



      - name: 라이브러리 설치

        run: |

          pip install -r requirements.txt



      # ======================
      # 13F
      # ======================

      - name: 13F 운용보고서 봇 실행

        env:

          SEC_13F_WEBHOOK_URL: ${{ secrets.SEC_13F_WEBHOOK_URL }}

        run:

          python 13f_bot.py



      # ======================
      # 8-K / 대주주
      # ======================

      - name: 대주주 8-K 공시 봇 실행

        env:

          SEC_OWNERSHIP_WEBHOOK_URL: ${{ secrets.SEC_OWNERSHIP_WEBHOOK_URL }}

        run:

          python ownership_bot.py



      # ======================
      # 뉴스
      # ======================

      - name: 시장 뉴스 봇 실행

        env:

          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

        run:

          python news_bot.py



      # ======================
      # JSON 저장
      # ======================

      - name: 상태 파일 저장

        run: |

          git config --local user.email "action@github.com"

          git config --local user.name "GitHub Action"

          git add *.json

          git diff --cached --quiet || git commit -m "🔄 SEC 및 뉴스 데이터 업데이트"

          git push
