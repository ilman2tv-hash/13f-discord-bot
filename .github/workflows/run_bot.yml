name: SEC 자동 알리미 + 시장 뉴스 봇


on:

  workflow_dispatch:

  schedule:

    # 월~금 매시간 순찰
    - cron: '0 * * * 1-5'


jobs:


  build:


    runs-on: ubuntu-latest


    permissions:

      contents: write



    steps:


      - name: 코드 체크아웃

        uses: actions/checkout@v3



      - name: 파이썬 세팅

        uses: actions/setup-python@v4

        with:

          python-version: '3.10'



      - name: 필수 라이브러리 설치

        run: |

          pip install requests feedparser



      # ==========================
      # 13F 기관 보유보고서
      # ==========================

      - name: 13F 운용보고서 봇 실행

        env:

          SEC_13F_WEBHOOK_URL: ${{ secrets.SEC_13F_WEBHOOK_URL }}

        run:

          python 13f_bot.py



      # ==========================
      # 대주주 / 8-K
      # ==========================

      - name: 대주주 및 8-K 공시 봇 실행

        env:

          SEC_OWNERSHIP_WEBHOOK_URL: ${{ secrets.SEC_OWNERSHIP_WEBHOOK_URL }}

        run:

          python ownership_bot.py



      # ==========================
      # 시장 뉴스
      # Form4 대체
      # ==========================

      - name: 시장 뉴스 봇 실행

        env:

          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

        run:

          python news_bot.py



      # ==========================
      # 상태 저장
      # ==========================

      - name: 변경된 상태 파일 저장

        run: |

          git config --local user.email "action@github.com"

          git config --local user.name "GitHub Action"

          git add *.json

          git diff-index --quiet HEAD || (

          git commit -m "🔄 정기 순찰: SEC 및 뉴스 데이터 업데이트"

          && git push

          )
