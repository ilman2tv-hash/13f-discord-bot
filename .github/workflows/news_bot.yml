name: 미국시장 뉴스 알리미


on:

  workflow_dispatch:


jobs:


  news:


    runs-on: ubuntu-latest


    permissions:

      contents: write


    steps:


      - name: 코드 체크아웃

        uses: actions/checkout@v4



      - name: Python 설치

        uses: actions/setup-python@v5

        with:

          python-version: '3.10'



      - name: 라이브러리 설치

        run:

          pip install requests feedparser deep-translator



      - name: 뉴스봇 실행

        env:

          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

        run:

          python news_bot.py



      - name: 뉴스 캐시 저장

        run: |

          git config --local user.email "action@github.com"

          git config --local user.name "GitHub Action"

          git add news_cache.json

          git diff --cached --quiet || git commit -m "뉴스 캐시 업데이트"

          git push
