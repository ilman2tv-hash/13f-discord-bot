name: SEC 자동 알리미 봇


on:

  workflow_dispatch:

  schedule:

    # 매시간
    - cron: '0 * * * 1-5'


jobs:

  build:

    runs-on: ubuntu-latest


    permissions:

      contents: write


    steps:


      - name: 코드 체크아웃

        uses: actions/checkout@v4



      - name: Python 설치

        uses: actions/setup-python@v5

        with:

          python-version: '3.10'



      - name: 라이브러리 설치

        run:

          pip install requests feedparser



      - name: 13F 실행

        env:

          SEC_13F_WEBHOOK_URL: ${{ secrets.SEC_13F_WEBHOOK_URL }}

        run:

          python 13f_bot.py



      - name: 대주주 8-K 실행

        env:

          SEC_OWNERSHIP_WEBHOOK_URL: ${{ secrets.SEC_OWNERSHIP_WEBHOOK_URL }}

        run:

          python ownership_bot.py



      - name: 상태 저장

        run: |

          git config --local user.email "action@github.com"

          git config --local user.name "GitHub Action"

          git add *.json

          git diff --cached --quiet || git commit -m "SEC 데이터 업데이트"

          git push
