name: 13F 공시 알리미 봇

on:
  schedule:
    - cron: '0 1 * * *' # 매일 한국 시간 오전 10시에 자동 실행
  workflow_dispatch: # 수동 실행 버튼 활성화

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: 코드 가져오기
      uses: actions/checkout@v3

    - name: 파이썬 설치
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 라이브러리 설치
      run: pip install requests

    - name: 봇 실행
      env:
        # 💡 이 부분을 우리가 새로 만든 이름(SEC_13F_WEBHOOK_URL)으로 맞춰줍니다!
        SEC_13F_WEBHOOK_URL: ${{ secrets.SEC_13F_WEBHOOK_URL }}
      run: python 13f_bot.py

